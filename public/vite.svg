<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="obsidianBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#0B0B0C" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="35%" stop-color="#F2E6D5" />
      <stop offset="70%" stop-color="#DEC096" />
      <stop offset="100%" stop-color="#C5A880" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6D7C3" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#C5A880" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E6D7C3" stop-opacity="0.5" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Squircle Container -->
  <rect width="64" height="64" rx="15" fill="url(#obsidianBg)" />
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="url(#goldBorder)" stroke-width="1.2" />

  <!-- Signature Atelier 4-Point Star (Top Right) -->
  <path d="M50 10 L51.8 14.2 L56 16 L51.8 17.8 L50 22 L48.2 17.8 L44 16 L48.2 14.2 Z" fill="#E6D7C3" filter="url(#softGlow)" />

  <!-- Elegant Editorial Monogram 'S' (Vector Path for 100% Cross-Browser Sharpness) -->
